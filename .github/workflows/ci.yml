name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/ndpi-observe-base:latest

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: docker pull ${{ env.BASE_IMAGE }} || true

      - name: Build CI image
        run: |
          docker build \
            --build-arg BASE_IMAGE=${{ env.BASE_IMAGE }} \
            -f Dockerfile.ci \
            -t ndpi-observe-ci .

      - name: Run tests
        run: |
          docker run --rm --privileged --network host \
            ndpi-observe-ci

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/*.log

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push demo image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ci
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ndpi-observe:latest

  deb:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build .deb inside CI container
        run: |
          docker run --rm -v $PWD:/src \
            ${{ env.BASE_IMAGE }} \
            bash -c "cd /src && apt-get install -y debhelper && dpkg-buildpackage -us -uc -b"
          mv ../ndpi-observe_*.deb . || true

      - name: Upload .deb to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ndpi-observe_*.deb
